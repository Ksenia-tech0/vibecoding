<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PyCodeCamp — Интерактивный курс Python</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0e27;
    --bg-2: #151935;
    --bg-3: #1e2347;
    --accent: #00d084;
    --accent-2: #00a86b;
    --text: #e8eaf6;
    --text-dim: #8b90b8;
    --border: #2a2f5a;
    --danger: #ff5c5c;
    --warning: #ffb84d;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--bg);
    font-weight: 900;
    font-size: 18px;
  }
  .progress-bar {
    flex: 1;
    max-width: 400px;
    margin: 0 24px;
    height: 8px;
    background: var(--bg-3);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.4s ease;
  }
  .stats {
    font-size: 14px;
    color: var(--text-dim);
  }
  .stats b { color: var(--accent); }
  main {
    flex: 1;
    display: flex;
    min-height: calc(100vh - 60px);
  }
  aside {
    width: 300px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }
  .module-title {
    padding: 10px 20px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-top: 8px;
  }
  .lesson-item {
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }
  .lesson-item:hover {
    background: var(--bg-3);
  }
  .lesson-item.active {
    background: var(--bg-3);
    border-left-color: var(--accent);
    color: var(--accent);
  }
  .lesson-item.completed::before {
    content: "✓";
    color: var(--accent);
    font-weight: bold;
  }
  .lesson-item:not(.completed)::before {
    content: "○";
    color: var(--text-dim);
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .lesson-content {
    flex: 1;
    overflow-y: auto;
    padding: 32px 48px;
    max-width: 900px;
  }
  .lesson-content h1 {
    color: var(--accent);
    margin-bottom: 16px;
    font-size: 32px;
  }
  .lesson-content h2 {
    color: var(--text);
    margin: 24px 0 12px;
    font-size: 22px;
  }
  .lesson-content p {
    line-height: 1.7;
    margin-bottom: 14px;
    color: var(--text);
  }
  .lesson-content ul, .lesson-content ol {
    margin: 12px 0 14px 24px;
    line-height: 1.7;
  }
  .lesson-content code:not(pre code) {
    background: var(--bg-3);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--accent);
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 14px;
  }
  .lesson-content pre {
    background: #282c34;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 14px 0;
    border: 1px solid var(--border);
  }
  .lesson-content pre code {
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 14px;
  }
  .task-box {
    background: var(--bg-3);
    border-left: 4px solid var(--warning);
    padding: 16px 20px;
    margin: 20px 0;
    border-radius: 0 8px 8px 0;
  }
  .task-box h3 {
    color: var(--warning);
    margin-bottom: 8px;
    font-size: 16px;
  }
  .editor-section {
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
  }
  .editor-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    align-items: center;
  }
  .tab {
    padding: 6px 14px;
    background: var(--bg-3);
    border-radius: 6px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .tab.active {
    background: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }
  .editor-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    height: 280px;
  }
  textarea.code-editor {
    width: 100%;
    height: 100%;
    background: #1e1e2e;
    color: #cdd6f4;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    outline: none;
    tab-size: 4;
  }
  textarea.code-editor:focus {
    border-color: var(--accent);
  }
  .output-panel {
    background: #0d0d1a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    overflow-y: auto;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    color: #cdd6f4;
  }
  .output-panel.error {
    color: var(--danger);
  }
  .output-panel.success {
    color: var(--accent);
  }
  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn-run {
    background: var(--bg-3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-run:hover { background: var(--border); }
  .btn-check {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-check:hover { background: var(--accent-2); }
  .btn-reset {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-reset:hover { color: var(--text); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 39, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 1000;
    gap: 20px;
  }
  .spinner {
    width: 60px; height: 60px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 20px;
    min-height: 100vh;
  }
  .welcome-screen h1 {
    font-size: 48px;
    margin-bottom: 16px;
    color: var(--accent);
  }
  .welcome-screen p {
    font-size: 18px;
    color: var(--text-dim);
    max-width: 600px;
    margin-bottom: 32px;
    line-height: 1.6;
  }
  .btn-start {
    padding: 14px 32px;
    background: var(--accent);
    color: var(--bg);
    font-size: 16px;
    font-weight: 700;
    border-radius: 8px;
  }
  .btn-start:hover { background: var(--accent-2); }
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    max-width: 800px;
    margin-top: 40px;
  }
  .feature {
    background: var(--bg-2);
    padding: 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .feature-icon {
    font-size: 32px;
    margin-bottom: 10px;
  }
  .feature h3 {
    color: var(--accent);
    margin-bottom: 8px;
  }
  .feature p {
    font-size: 14px;
    color: var(--text-dim);
  }
  @media (max-width: 900px) {
    aside { width: 220px; }
    .lesson-content { padding: 24px; }
    .editor-wrapper { grid-template-columns: 1fr; height: auto; }
    textarea.code-editor, .output-panel { height: 200px; }
  }
  @media (max-width: 600px) {
    aside { display: none; }
    .progress-bar { display: none; }
  }
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <div style="color: var(--accent); font-size: 18px;">Загружаем Python в браузер...</div>
  <div style="color: var(--text-dim); font-size: 14px;">Это может занять несколько секунд</div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">Py</div>
    <span>PyCodeCamp</span>
  </div>
  <div class="progress-bar">
    <div id="progressFill" class="progress-fill" style="width: 0%"></div>
  </div>
  <div class="stats">
    Пройдено: <b id="completedCount">0</b> / <b id="totalCount">0</b>
  </div>
</header>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
// ============ ДАННЫЕ КУРСА ============
const COURSE = [
  {
    module: "Основы Python",
    lessons: [
      {
        id: "intro",
        title: "Привет, Python!",
        theory: `
          <h1>Привет, Python!</h1>
          <p>Python — один из самых популярных языков программирования в мире. Он известен своим простым и читаемым синтаксисом, что делает его идеальным для начинающих.</p>
          <h2>Ваша первая программа</h2>
          <p>Традиционно изучение любого языка начинают с программы, которая выводит на экран текст <code>"Hello, World!"</code>. В Python это делается с помощью функции <code>print()</code>:</p>
          <pre><code class="language-python">print("Hello, World!")</code></pre>
          <p>Функция <code>print()</code> выводит на экран то, что указано в скобках. Текст (строка) обязательно заключается в кавычки — двойные <code>" "</code> или одинарные <code>' '</code>.</p>
        `,
        task: "Выведите на экран фразу: <b>Hello, World!</b>",
        starterCode: '# Напишите код здесь\n',
        check: (output) => output.trim() === "Hello, World!"
      },
      {
        id: "comments",
        title: "Комментарии",
        theory: `
          <h1>Комментарии</h1>
          <p>Комментарии — это пояснения в коде, которые игнорируются интерпретатором. Они помогают другим людям (и вам самим в будущем) понять, что делает код.</p>
          <h2>Однострочные комментарии</h2>
          <p>Начинаются с символа <code>#</code>:</p>
          <pre><code class="language-python"># Это комментарий
print("Привет")  # Это тоже комментарий</code></pre>
          <h2>Многострочные комментарии</h2>
          <p>Используются тройные кавычки <code>"""</code> или <code>'''</code>:</p>
          <pre><code class="language-python">"""
Это многострочный
комментарий
"""</code></pre>
        `,
        task: "Добавьте комментарий в код и выведите слово <b>Python</b>",
        starterCode: '# Добавьте комментарий и выведите Python\n',
        check: (output) => output.trim() === "Python"
      },
      {
        id: "variables",
        title: "Переменные",
        theory: `
          <h1>Переменные</h1>
          <p>Переменная — это именованная ячейка памяти, которая хранит данные. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
          <h2>Создание переменных</h2>
          <pre><code class="language-python">name = "Алиса"
age = 25
height = 1.68
is_student = True

print(name)
print(age)</code></pre>
          <h2>Правила именования</h2>
          <ul>
            <li>Имя может содержать буквы, цифры и символ подчёркивания <code>_</code></li>
            <li>Не может начинаться с цифры</li>
            <li>Регистр имеет значение: <code>name</code> и <code>Name</code> — разные переменные</li>
            <li>Нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code> и т.д.)</li>
          </ul>
        `,
        task: "Создайте переменную <code>language</code> со значением <code>\"Python\"</code> и выведите её",
        starterCode: '# Создайте переменную language и выведите её\n',
        check: (output) => output.trim() === "Python"
      },
      {
        id: "data-types",
        title: "Типы данных",
        theory: `
          <h1>Типы данных</h1>
          <p>В Python есть несколько основных типов данных:</p>
          <ul>
            <li><b>int</b> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
            <li><b>float</b> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
            <li><b>str</b> — строки: <code>"Привет"</code>, <code>'Python'</code></li>
            <li><b>bool</b> — логический тип: <code>True</code> или <code>False</code></li>
            <li><b>NoneType</b> — отсутствие значения: <code>None</code></li>
          </ul>
          <p>Функция <code>type()</code> позволяет узнать тип переменной:</p>
          <pre><code class="language-python">x = 10
print(type(x))  # &lt;class 'int'&gt;

y = "hello"
print(type(y))  # &lt;class 'str'&gt;</code></pre>
        `,
        task: "Создайте переменную <code>pi</code> со значением <code>3.14</code> и выведите её тип через <code>type()</code>",
        starterCode: '# Создайте pi и выведите её тип\n',
        check: (output) => output.trim() === "<class 'float'>"
      }
    ]
  },
  {
    module: "Строки и числа",
    lessons: [
      {
        id: "strings",
        title: "Работа со строками",
        theory: `
          <h1>Работа со строками</h1>
          <p>Строки — это последовательности символов. С ними можно выполнять множество операций.</p>
          <h2>Конкатенация (сложение)</h2>
          <pre><code class="language-python">first = "Hello"
second = "World"
result = first + " " + second
print(result)  # Hello World</code></pre>
          <h2>Повторение</h2>
          <pre><code class="language-python">print("Ha" * 3)  # HaHaHa</code></pre>
          <h2>Длина строки</h2>
          <pre><code class="language-python">text = "Python"
print(len(text))  # 6</code></pre>
          <h2>Методы строк</h2>
          <pre><code class="language-python">s = "hello"
print(s.upper())      # HELLO
print(s.lower())      # hello
print(s.capitalize()) # Hello
print(s.replace("l", "L"))  # heLLo</code></pre>
        `,
        task: "Создайте строку <code>\"Python\"</code> и выведите её в верхнем регистре",
        starterCode: '# Создайте строку и выведите её в верхнем регистре\n',
        check: (output) => output.trim() === "PYTHON"
      },
      {
        id: "f-strings",
        title: "Форматирование строк",
        theory: `
          <h1>F-строки</h1>
          <p>F-строки (format strings) — самый удобный способ вставлять переменные в строку. Перед строкой ставится буква <code>f</code>, а переменные помещаются в фигурные скобки:</p>
          <pre><code class="language-python">name = "Алиса"
age = 25
print(f"Меня зовут {name} и мне {age} лет")</code></pre>
          <p>Внутри скобок можно выполнять вычисления:</p>
          <pre><code class="language-python">x = 10
y = 20
print(f"Сумма: {x + y}")  # Сумма: 30</code></pre>
        `,
        task: "Создайте переменные <code>name = \"Python\"</code> и <code>version = 3</code>, выведите: <code>Python 3</code>",
        starterCode: '# Используйте f-строку\n',
        check: (output) => output.trim() === "Python 3"
      },
      {
        id: "numbers",
        title: "Числа и математика",
        theory: `
          <h1>Числа и математика</h1>
          <p>Python поддерживает все стандартные математические операции:</p>
          <pre><code class="language-python">a = 10
b = 3

print(a + b)   # 13 - сложение
print(a - b)   # 7  - вычитание
print(a * b)   # 30 - умножение
print(a / b)   # 3.333... - деление
print(a // b)  # 3  - целочисленное деление
print(a % b)   # 1  - остаток от деления
print(a ** b)  # 1000 - возведение в степень</code></pre>
          <h2>Приоритет операций</h2>
          <p>Как в математике: сначала скобки, потом степень, умножение/деление, сложение/вычитание.</p>
          <pre><code class="language-python">print(2 + 3 * 4)     # 14
print((2 + 3) * 4)   # 20</code></pre>
        `,
        task: "Вычислите и выведите результат: <code>2 в степени 10</code>",
        starterCode: '# Вычислите 2 ** 10\n',
        check: (output) => output.trim() === "1024"
      },
      {
        id: "input",
        title: "Ввод данных",
        theory: `
          <h1>Ввод данных от пользователя</h1>
          <p>Функция <code>input()</code> позволяет получить данные от пользователя. Она всегда возвращает строку!</p>
          <pre><code class="language-python">name = input("Как тебя зовут? ")
print(f"Привет, {name}!")</code></pre>
          <h2>Преобразование типов</h2>
          <p>Чтобы работать с числами, нужно преобразовать строку:</p>
          <pre><code class="language-python">age = int(input("Введите возраст: "))
print(f"Через год тебе будет {age + 1}")</code></pre>
          <p>Функции преобразования: <code>int()</code>, <code>float()</code>, <code>str()</code>, <code>bool()</code>.</p>
          <p><b>Внимание:</b> В этой среде <code>input()</code> работает ограниченно — для тестов используйте фиксированные значения.</p>
        `,
        task: "Создайте переменную <code>x = \"42\"</code>, преобразуйте её в число и выведите результат умножения на 2",
        starterCode: '# Преобразуйте строку в число и умножьте на 2\n',
        check: (output) => output.trim() === "84"
      }
    ]
  },
  {
    module: "Условия и циклы",
    lessons: [
      {
        id: "if-else",
        title: "Условные операторы",
        theory: `
          <h1>Условные операторы if/else</h1>
          <p>Условные операторы позволяют выполнять разный код в зависимости от условий.</p>
          <pre><code class="language-python">age = 18

if age >= 18:
    print("Вы совершеннолетний")
else:
    print("Вы несовершеннолетний")</code></pre>
          <h2>Конструкция if/elif/else</h2>
          <pre><code class="language-python">score = 85

if score >= 90:
    grade = "A"
elif score >= 80:
    grade = "B"
elif score >= 70:
    grade = "C"
else:
    grade = "F"

print(grade)  # B</code></pre>
          <h2>Операторы сравнения</h2>
          <ul>
            <li><code>==</code> равно, <code>!=</code> не равно</li>
            <li><code>&gt;</code> больше, <code>&lt;</code> меньше</li>
            <li><code>&gt;=</code> больше или равно, <code>&lt;=</code> меньше или равно</li>
          </ul>

# Словарь Python -> JSON-строка
data = {"name": "Алиса", "age": 25}
json_str = json.dumps(data, ensure_ascii=False)
print(json_str)

# JSON-строка -> словарь Python
parsed = json.loads(json_str)
print(parsed["name"])</code></pre>
          <h2>Форматированный вывод</h2>
          <pre><code class="language-python">print(json.dumps(data, indent=2, ensure_ascii=False))</code></pre>
        `,
        task: "Создайте словарь <code>{\"name\": \"Python\", \"version\": 3}</code>, преобразуйте в JSON-строку и выведите её",
        starterCode: '# Импортируйте json и работайте с данными\n',
        check: (output) => output.includes('"name"') && output.includes('"Python"') && output.includes('"version"')
      },
      {
        id: "regex",
        title: "Регулярные выражения",
        theory: `
          <h1>Регулярные выражения</h1>
          <p>Модуль <code>re</code> для работы с регулярными выражениями:</p>
          <pre><code class="language-python">import re

text = "Мой телефон: 8-999-123-45-67"

# Поиск
match = re.search(r'\\d{3}-\\d{3}-\\d{2}-\\d{2}', text)
if match:
    print(match.group())  # 999-123-45-67

# Все совпадения
text2 = "Цены: 100р, 200р, 300р"
prices = re.findall(r'\\d+', text2)
print(prices)  # ['100', '200', '300']

# Замена
cleaned = re.sub(r'\\d', 'X', "abc123def")
print(cleaned)  # abcXXXdef</code></pre>
        `,
        task: "Используя <code>re.findall</code>, извлеките все числа из строки <code>\"a1b22c333d4444\"</code> и выведите список",
        starterCode: '# Импортируйте re и найдите числа\n',
        check: (output) => output.trim() === "['1', '22', '333', '4444']"
      },
      {
        id: "final",
        title: "Финальный проект",
        theory: `
          <h1>🎉 Финальный проект</h1>
          <p>Поздравляем! Вы прошли весь курс. Пришло время применить все знания.</p>
          <h2>Задача</h2>
          <p>Создайте класс <code>Student</code> со следующими свойствами и методами:</p>
          <ul>
            <li>Конструктор принимает <code>name</code> и список <code>grades</code></li>
            <li>Метод <code>average()</code> возвращает средний балл</li>
            <li>Метод <code>is_passed()</code> возвращает <code>True</code>, если средний балл >= 4</li>
            <li>Метод <code>__str__()</code> возвращает строку вида <code>"Студент: Имя (средний: X.X)"</code></li>
          </ul>
          <p>Создайте студента <code>"Иван"</code> с оценками <code>[5, 4, 5, 3, 4]</code> и выведите строковое представление.</p>
        `,
        task: "Реализуйте класс Student и выведите результат для студента Иван с оценками [5, 4, 5, 3, 4]",
        starterCode: '# Реализуйте класс Student\nclass Student:\n    pass\n\n# Создайте студента и выведите его\n',
        check: (output) => output.trim() === "Студент: Иван (средний: 4.2)"
      }
    ]
  }
];

// ============ СОСТОЯНИЕ ПРИЛОЖЕНИЯ ============
const state = {
  currentLesson: null,
  completed: JSON.parse(localStorage.getItem('pycodecamp_completed') || '[]'),
  pyodide: null,
  isReady: false
};

// Подсчёт общего количества уроков
const allLessons = COURSE.flatMap(m => m.lessons);
document.getElementById('totalCount').textContent = allLessons.length;

// ============ ИНИЦИАЛИЗАЦИЯ PYODIDE ============
async function initPyodide() {
  try {
    state.pyodide = await loadPyodide();
    state.isReady = true;
    document.getElementById('loadingOverlay').style.display = 'none';
    renderApp();
  } catch (e) {
    document.getElementById('loadingOverlay').innerHTML = `
      <div style="color: var(--danger); text-align: center; padding: 20px;">
        <h2>Ошибка загрузки Python</h2>
        <p style="margin-top: 10px;">${e.message}</p>
        <button onclick="location.reload()" style="margin-top: 20px; background: var(--accent); color: var(--bg); padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">
          Попробовать снова
        </button>
      </div>
    `;
  }
}

// ============ ВЫПОЛНЕНИЕ КОДА ============
async function runCode(code) {
  if (!state.isReady) return { output: '', error: 'Python ещё не загружен' };
  
  // Перехватываем stdout
  state.pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
  `);
  
  try {
    await state.pyodide.runPythonAsync(code);
    const output = state.pyodide.runPython('sys.stdout.getvalue()');
    const error = state.pyodide.runPython('sys.stderr.getvalue()');
    return { output, error };
  } catch (e) {
    return { output: '', error: e.message };
  }
}

// ============ РЕНДЕРИНГ ============
function renderApp() {
  const app = document.getElementById('app');
  
  if (!state.currentLesson) {
    app.innerHTML = renderWelcome();
    document.querySelector('.btn-start').onclick = () => {
      state.currentLesson = allLessons[0];
      renderApp();
    };
    return;
  }
  
  app.innerHTML = `
    <main>
      <aside id="sidebar"></aside>
      <section class="content">
        <div class="lesson-content" id="lessonContent"></div>
        <div class="editor-section">
          <div class="editor-tabs">
            <div class="tab active">📝 Редактор</div>
            <div class="tab">📤 Вывод</div>
          </div>
          <div class="editor-wrapper">
            <textarea id="codeEditor" class="code-editor" spellcheck="false"></textarea>
            <div id="outputPanel" class="output-panel">Здесь появится результат выполнения кода...</div>
          </div>
          <div class="btn-group">
            <button class="btn-run" id="btnRun">▶ Запустить</button>
            <button class="btn-check" id="btnCheck">✓ Проверить задание</button>
            <button class="btn-reset" id="btnReset">↺ Сбросить</button>
            <button class="btn-run" id="btnPrev" style="margin-left: auto;">← Назад</button>
            <button class="btn-run" id="btnNext">Далее →</button>
          </div>
        </div>
      </section>
    </main>
  `;
  
  renderSidebar();
  renderLesson();
  attachEventListeners();
  updateProgress();
}

function renderWelcome() {
  return `
    <div class="welcome-screen">
      <h1>🐍 PyCodeCamp</h1>
      <p>Интерактивный курс Python прямо в вашем браузере. Изучайте программирование с практикой — пишите код, получайте мгновенную обратную связь и отслеживайте прогресс.</p>
      <button class="btn-start">Начать обучение</button>
      <div class="features">
        <div class="feature">
          <div class="feature-icon">💻</div>
          <h3>Живой код</h3>
          <p>Python выполняется прямо в браузере через WebAssembly</p>
        </div>
        <div class="feature">
          <div class="feature-icon">📚</div>
          <h3>${allLessons.length} уроков</h3>
          <p>От основ до продвинутых тем с практическими заданиями</p>
        </div>
        <div class="feature">
          <div class="feature-icon">✓</div>
          <h3>Автопроверка</h3>
          <p>Мгновенная проверка ваших решений</p>
        </div>
        <div class="feature">
          <div class="feature-icon">💾</div>
          <h3>Сохранение прогресса</h3>
          <p>Ваш прогресс сохраняется в браузере</p>
        </div>
      </div>
    </div>
  `;
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '';
  
  COURSE.forEach(module => {
    html += `<div class="module-title">${module.module}</div>`;
    module.lessons.forEach(lesson => {
      const isActive = state.currentLesson.id === lesson.id;
      const isCompleted = state.completed.includes(lesson.id);
      html += `
        <div class="lesson-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}" 
             data-id="${lesson.id}">
          ${lesson.title}
        </div>
      `;
    });
  });
  
  sidebar.innerHTML = html;
  
  sidebar.querySelectorAll('.lesson-item').forEach(item => {
    item.onclick = () => {
      const id = item.dataset.id;
      state.currentLesson = allLessons.find(l => l.id === id);
      renderApp();
    };
  });
}

function renderLesson() {
  const lesson = state.currentLesson;
  const content = document.getElementById('lessonContent');
  
  content.innerHTML = `
    ${lesson.theory}
    <div class="task-box">
      <h3>🎯 Задание</h3>
      <p>${lesson.task}</p>
    </div>
  `;
  
  // Подсветка синтаксиса
  content.querySelectorAll('pre code').forEach(block => {
    hljs.highlightElement(block);
  });
  
  // Код в редакторе
  const editor = document.getElementById('codeEditor');
  const savedCode = localStorage.getItem(`pycodecamp_code_${lesson.id}`);
  editor.value = savedCode || lesson.starterCode;
  
  // Обработка Tab
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 4;
    }
  });
  
  // Автосохранение кода
  editor.addEventListener('input', () => {
    localStorage.setItem(`pycodecamp_code_${lesson.id}`, editor.value);
  });
}

function attachEventListeners() {
  document.getElementById('btnRun').onclick = async () => {
    const code = document.getElementById('codeEditor').value;
    const output = document.getElementById('outputPanel');
    output.className = 'output-panel';
    output.textContent = 'Выполняется...';
    
    const result = await runCode(code);
    
    if (result.error) {
      output.className = 'output-panel error';
      output.textContent = 'Ошибка:\n' + result.error;
    } else {
      output.textContent = result.output || '(нет вывода)';
    }
  };
  
  document.getElementById('btnCheck').onclick = async () => {
    const code = document.getElementById('codeEditor').value;
    const output = document.getElementById('outputPanel');
    output.className = 'output-panel';
    output.textContent = 'Проверяем...';
    
    const result = await runCode(code);
    
    if (result.error) {
      output.className = 'output-panel error';
      output.textContent = '❌ Ошибка в коде:\n' + result.error;
      return;
    }
    
    const isCorrect = state.currentLesson.check(result.output);
    
    if (isCorrect) {
      output.className = 'output-panel success';
      output.textContent = '✅ Отлично! Задание выполнено верно!';
      
      if (!state.completed.includes(state.currentLesson.id)) {
        state.completed.push(state.currentLesson.id);
        localStorage.setItem('pycodecamp_completed', JSON.stringify(state.completed));
        updateProgress();
        renderSidebar();
      }
    } else {
      output.className = 'output-panel error';
      output.textContent = '❌ Пока не совсем верно. Проверьте задание и попробуйте снова.\n\nВаш вывод:\n' + (result.output || '(пусто)');
    }
  };
  
  document.getElementById('btnReset').onclick = () => {
    if (confirm('Сбросить код к начальному состоянию?')) {
      document.getElementById('codeEditor').value = state.currentLesson.starterCode;
      localStorage.removeItem(`pycodecamp_code_${state.currentLesson.id}`);
      document.getElementById('outputPanel').className = 'output-panel';
      document.getElementById('outputPanel').textContent = 'Здесь появится результат выполнения кода...';
    }
  };
  
  document.getElementById('btnPrev').onclick = () => {
    const idx = allLessons.findIndex(l => l.id === state.currentLesson.id);
    if (idx > 0) {
      state.currentLesson = allLessons[idx - 1];
      renderApp();
    }
  };
  
  document.getElementById('btnNext').onclick = () => {
    const idx = allLessons.findIndex(l => l.id === state.currentLesson.id);
    if (idx < allLessons.length - 1) {
      state.currentLesson = allLessons[idx + 1];
      renderApp();
    } else {
      alert('🎉 Поздравляем! Вы прошли весь курс!');
    }
  };
}

function updateProgress() {
  const percent = (state.completed.length / allLessons.length) * 100;
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('completedCount').textContent = state.completed.length;
}

// Запуск
initPyodide();
</script>
</body>
</html>
