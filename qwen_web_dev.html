<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyLearn — Бесплатный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/fira-code@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-dark: #0a0a23;
  --bg-darker: #001800;
  --bg-panel: #1b1b32;
  --bg-card: #2a2a40;
  --bg-code: #0d1117;
  --accent: #dfdfe2;
  --accent-green: #acd157;
  --accent-blue: #3b82f6;
  --accent-purple: #a855f7;
  --border: #3b3b4f;
  --text: #f5f6f7;
  --text-dim: #858591;
  --success: #22c55e;
  --error: #ef4444;
}
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
/* Header */
.header {
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 20px;
  font-weight: 700;
}
.logo-icon {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: var(--bg-dark);
}
.logo-text span { color: var(--accent-green); }
.header-stats {
  display: flex;
  gap: 20px;
  align-items: center;
}
.stat-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: var(--bg-card);
  border-radius: 20px;
  font-size: 14px;
}
.stat-badge .num { color: var(--accent-green); font-weight: 700; }
.progress-bar-wrap {
  width: 200px;
  height: 8px;
  background: var(--bg-card);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
  transition: width 0.5s ease;
  border-radius: 4px;
}
/* Layout */
.layout {
  display: flex;
  min-height: calc(100vh - 65px);
}
/* Sidebar */
.sidebar {
  width: 320px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  transition: transform 0.3s;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
}
.lesson-item {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.lesson-item:hover { background: var(--bg-card); }
.lesson-item.active {
  background: var(--bg-card);
  border-left: 3px solid var(--accent-green);
  padding-left: 17px;
}
.lesson-item.completed .lesson-check {
  background: var(--success);
  color: white;
}
.lesson-check {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}
.lesson-item.active .lesson-check {
  border-color: var(--accent-green);
}
.lesson-info { flex: 1; min-width: 0; }
.lesson-title {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 2px;
}
.lesson-meta {
  font-size: 12px;
  color: var(--text-dim);
}
/* Main content */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 40px;
}
.content-area::-webkit-scrollbar { width: 8px; }
.content-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.lesson-header {
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.lesson-badge {
  display: inline-block;
  padding: 4px 12px;
  background: var(--accent-green);
  color: var(--bg-dark);
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 12px;
}
.lesson-h1 {
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--text), var(--accent-green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.lesson-subtitle {
  color: var(--text-dim);
  font-size: 15px;
}
.theory {
  line-height: 1.8;
  font-size: 16px;
}
.theory h2 {
  font-size: 22px;
  margin: 30px 0 15px;
  color: var(--accent-green);
}
.theory h3 {
  font-size: 18px;
  margin: 20px 0 10px;
  color: var(--accent-blue);
}
.theory p { margin-bottom: 14px; }
.theory ul, .theory ol {
  margin: 10px 0 14px 24px;
}
.theory li { margin-bottom: 6px; }
.theory code {
  background: var(--bg-code);
  padding: 2px 8px;
  border-radius: 4px;
  font-family: 'Fira Code', monospace;
  font-size: 14px;
  color: var(--accent-green);
}
.theory pre {
  background: var(--bg-code);
  padding: 16px 20px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 14px 0;
  border: 1px solid var(--border);
}
.theory pre code {
  background: none;
  padding: 0;
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
}
.info-box {
  background: rgba(59, 130, 246, 0.1);
  border-left: 4px solid var(--accent-blue);
  padding: 14px 18px;
  margin: 16px 0;
  border-radius: 4px;
}
.info-box strong { color: var(--accent-blue); }
/* Task section */
.task-section {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin: 30px 0;
}
.task-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.task-icon {
  width: 36px;
  height: 36px;
  background: var(--accent-purple);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.task-title {
  font-size: 18px;
  font-weight: 700;
}
.task-description {
  line-height: 1.7;
  margin-bottom: 16px;
}
.task-description code {
  background: var(--bg-code);
  padding: 2px 8px;
  border-radius: 4px;
  font-family: 'Fira Code', monospace;
  font-size: 14px;
  color: var(--accent-green);
}
.hint-box {
  background: rgba(168, 85, 247, 0.1);
  border-left: 4px solid var(--accent-purple);
  padding: 12px 16px;
  margin: 12px 0;
  border-radius: 4px;
  font-size: 14px;
  cursor: pointer;
}
.hint-box summary {
  font-weight: 600;
  color: var(--accent-purple);
  cursor: pointer;
}
.hint-box[open] { padding-bottom: 16px; }
.hint-content { margin-top: 10px; }
/* Code editor */
.editor-wrap {
  background: var(--bg-code);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-top: 16px;
}
.editor-toolbar {
  background: #161b22;
  padding: 8px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.editor-dots {
  display: flex;
  gap: 6px;
}
.editor-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}
.editor-dot.red { background: #ff5f56; }
.editor-dot.yellow { background: #ffbd2e; }
.editor-dot.green { background: #27c93f; }
.editor-filename {
  font-family: 'Fira Code', monospace;
  font-size: 12px;
  color: var(--text-dim);
}
.code-editor {
  width: 100%;
  min-height: 150px;
  background: transparent;
  color: var(--text);
  border: none;
  padding: 16px;
  font-family: 'Fira Code', monospace;
  font-size: 14px;
  line-height: 1.6;
  resize: vertical;
  outline: none;
  tab-size: 4;
}
.editor-actions {
  padding: 12px 14px;
  display: flex;
  gap: 10px;
  border-top: 1px solid var(--border);
  background: #161b22;
}
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-primary {
  background: var(--accent-green);
  color: var(--bg-dark);
}
.btn-primary:hover { background: #bde06a; transform: translateY(-1px); }
.btn-secondary {
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--border); }
.btn-nav {
  background: var(--accent-blue);
  color: white;
}
.btn-nav:hover { background: #2563eb; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
/* Output */
.output-wrap {
  background: var(--bg-code);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-top: 12px;
  overflow: hidden;
  display: none;
}
.output-wrap.visible { display: block; }
.output-header {
  background: #161b22;
  padding: 8px 14px;
  font-size: 12px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.output-content {
  padding: 14px;
  font-family: 'Fira Code', monospace;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  max-height: 300px;
  overflow-y: auto;
  color: var(--text);
}
.output-content.error { color: var(--error); }
.output-content.success { color: var(--success); }
/* Task result */
.task-result {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: 8px;
  font-weight: 600;
  display: none;
  align-items: center;
  gap: 10px;
}
.task-result.visible { display: flex; }
.task-result.success {
  background: rgba(34, 197, 94, 0.15);
  border: 1px solid var(--success);
  color: var(--success);
}
.task-result.error {
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid var(--error);
  color: var(--error);
}
/* Navigation */
.lesson-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
/* Welcome screen */
.welcome {
  text-align: center;
  padding: 60px 20px;
}
.welcome h1 {
  font-size: 48px;
  margin-bottom: 20px;
  background: linear-gradient(135deg, var(--accent-green), var(--accent-blue), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.welcome p {
  font-size: 18px;
  color: var(--text-dim);
  max-width: 600px;
  margin: 0 auto 30px;
  line-height: 1.6;
}
.welcome-stats {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin: 40px 0;
}
.welcome-stat {
  text-align: center;
}
.welcome-stat .num {
  font-size: 36px;
  font-weight: 700;
  color: var(--accent-green);
}
.welcome-stat .label {
  color: var(--text-dim);
  font-size: 14px;
  margin-top: 4px;
}
/* Loading */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-dark);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 0.5s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 60px;
  height: 60px;
  border: 4px solid var(--border);
  border-top-color: var(--accent-green);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  margin-top: 20px;
  color: var(--text-dim);
  font-size: 16px;
}
/* Mobile */
.menu-toggle {
  display: none;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 18px;
}
@media (max-width: 900px) {
  .menu-toggle { display: block; }
  .sidebar {
    position: fixed;
    top: 65px;
    left: 0;
    bottom: 0;
    z-index: 50;
    transform: translateX(-100%);
  }
  .sidebar.open { transform: translateX(0); }
  .content-area { padding: 20px; }
  .lesson-h1 { font-size: 24px; }
  .welcome h1 { font-size: 32px; }
  .header-stats .progress-bar-wrap { width: 100px; }
}
/* Animations */
.fade-in { animation: fadeIn 0.4s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Загрузка интерпретатора Python...</div>
  <div class="loading-text" style="font-size:13px;margin-top:8px;">Первый запуск может занять до 30 секунд</div>
</div>

<header class="header">
  <div style="display:flex;align-items:center;gap:16px;">
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <div class="logo">
      <div class="logo-icon">Py</div>
      <div class="logo-text">Py<span>Learn</span></div>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat-badge">
      <span>🔥</span>
      <span class="num" id="completedCount">0</span>
      <span>/ <span id="totalCount">0</span></span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">Программа курса</div>
    <div id="lessonList"></div>
  </aside>

  <main class="main">
    <div class="content-area" id="contentArea"></div>
  </main>
</div>

<script>
// ============ COURSE DATA ============
const lessons = [
  {
    id: 0,
    title: "Добро пожаловать",
    meta: "Введение • 2 мин",
    theory: `
      <h2>👋 Привет, будущий Python-разработчик!</h2>
      <p>Добро пожаловать на <strong>бесплатный интерактивный курс Python</strong>. Здесь вы пройдёте путь от самых основ до продвинутых концепций.</p>
      <h3>Что вас ждёт:</h3>
      <ul>
        <li>📚 <strong>15 уроков</strong> с теорией и примерами</li>
        <li>💻 <strong>Интерактивные задания</strong> — пишите код прямо в браузере</li>
        <li>✅ <strong>Автоматическая проверка</strong> ваших решений</li>
        <li>🐍 <strong>Настоящий Python</strong> — код выполняется через Pyodide</li>
      </ul>
      <div class="info-box">
        <strong>💡 Совет:</strong> Не бойтесь экспериментировать! Меняйте код в примерах и смотрите, что получится.
      </div>
      <h3>Как работать с курсом:</h3>
      <ol>
        <li>Прочитайте теорию урока</li>
        <li>Изучите примеры кода</li>
        <li>Выполните задания в редакторе</li>
        <li>Нажмите «Запустить и проверить»</li>
        <li>Переходите к следующему уроку</li>
      </ol>
      <p>Ваш прогресс сохраняется автоматически. Удачи!</p>
    `,
    tasks: []
  },
  {
    id: 1,
    title: "Hello, World!",
    meta: "Урок 1 • 5 мин",
    theory: `
      <h2>🚀 Ваша первая программа</h2>
      <p>Традиционно изучение любого языка программирования начинается с программы, которая выводит на экран текст <code>"Hello, World!"</code>.</p>
      <h3>Функция print()</h3>
      <p>В Python для вывода информации на экран используется функция <code>print()</code>:</p>
      <pre><code>print("Hello, World!")</code></pre>
      <p>Текст внутри кавычек называется <strong>строкой</strong> (string). Кавычки могут быть одинарными или двойными:</p>
      <pre><code>print('Привет, мир!')
print("Python - это круто!")</code></pre>
      <h3>Несколько вызовов print</h3>
      <p>Каждый вызов <code>print()</code> выводит текст на новой строке:</p>
      <pre><code>print("Строка 1")
print("Строка 2")
print("Строка 3")</code></pre>
      <div class="info-box">
        <strong>💡 Важно:</strong> Python чувствителен к регистру. <code>Print()</code> и <code>print()</code> — это разные вещи.
      </div>
    `,
    tasks: [
      {
        title: "Задание 1: Приветствие",
        description: "Напишите программу, которая выводит на экран текст <code>Hello, World!</code> (именно так, с заглавных букв и с восклицательным знаком).",
        starter: '# Напишите ваш код здесь\n',
        hint: "Используйте функцию print() с текстом в кавычках: print(\"Hello, World!\")",
        validate: (output) => output.trim() === "Hello, World!"
      },
      {
        title: "Задание 2: Несколько строк",
        description: "Напишите программу, которая выводит три строки:<br>1. <code>Меня зовут Python</code><br>2. <code>Я люблю код</code><br>3. <code>Учусь программировать</code>",
        starter: '# Выведите три строки\n',
        hint: "Вызовите print() три раза, каждый раз с разным текстом.",
        validate: (output) => {
          const lines = output.trim().split('\n');
          return lines.length === 3 &&
                 lines[0].trim() === "Меня зовут Python" &&
                 lines[1].trim() === "Я люблю код" &&
                 lines[2].trim() === "Учусь программировать";
        }
      }
    ]
  },
  {
    id: 2,
    title: "Переменные",
    meta: "Урок 2 • 8 мин",
    theory: `
      <h2>📦 Переменные</h2>
      <p>Переменная — это именованная ячейка памяти, которая хранит данные. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
      <h3>Создание переменных</h3>
      <pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True</code></pre>
      <h3>Правила именования</h3>
      <ul>
        <li>Имя может содержать буквы, цифры и символ <code>_</code></li>
        <li>Не может начинаться с цифры</li>
        <li>Регистр имеет значение: <code>Name</code> и <code>name</code> — разные переменные</li>
        <li>Нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code> и т.д.)</li>
      </ul>
      <h3>Вывод переменных</h3>
      <pre><code>name = "Боб"
age = 30
print(name)
print(age)
print(name, age)</code></pre>
      <h3>F-строки (форматирование)</h3>
      <p>Самый удобный способ вставлять переменные в строки:</p>
      <pre><code>name = "Алиса"
age = 25
print(f"Меня зовут {name}, мне {age} лет")</code></pre>
      <div class="info-box">
        <strong>💡 Совет:</strong> Используйте осмысленные имена переменных. <code>user_name</code> лучше, чем <code>x</code>.
      </div>
    `,
    tasks: [
      {
        title: "Задание 1: Создание переменных",

// ============ STATE ============
let pyodide = null;
let currentLesson = 0;
let currentTask = 0;
let completedTasks = JSON.parse(localStorage.getItem('pylearn_completed') || '{}');
let editorStates = JSON.parse(localStorage.getItem('pylearn_editors') || '{}');

// ============ INIT ============
async function initPyodide() {
  try {
    pyodide = await loadPyodide();
    document.getElementById('loadingOverlay').classList.add('hidden');
    renderSidebar();
    renderLesson(0);
    updateProgress();
  } catch (e) {
    document.querySelector('.loading-text').textContent = 'Ошибка загрузки: ' + e.message;
  }
}

function renderSidebar() {
  const list = document.getElementById('lessonList');
  list.innerHTML = lessons.map((lesson, i) => {
    const isCompleted = isLessonCompleted(i);
    const isActive = i === currentLesson;
    return `
      <div class="lesson-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}"
           onclick="selectLesson(${i})">
        <div class="lesson-check">${isCompleted ? '✓' : i + 1}</div>
        <div class="lesson-info">
          <div class="lesson-title">${lesson.title}</div>
          <div class="lesson-meta">${lesson.meta}</div>
        </div>
      </div>
    `;
  }).join('');
  document.getElementById('totalCount').textContent = lessons.length;
}

function isLessonCompleted(lessonId) {
  const lesson = lessons[lessonId];
  if (!lesson.tasks || lesson.tasks.length === 0) return !!completedTasks[`lesson_${lessonId}_welcome`];
  return lesson.tasks.every((_, taskIdx) => completedTasks[`lesson_${lessonId}_task_${taskIdx}`]);
}

function updateProgress() {
  let total = 0, done = 0;
  lessons.forEach((lesson, lid) => {
    if (lid === 0) {
      total++;
      if (completedTasks[`lesson_0_welcome`]) done++;
      return;
    }
    if (!lesson.tasks || lesson.tasks.length === 0) return;
    lesson.tasks.forEach((_, tid) => {
      total++;
      if (completedTasks[`lesson_${lid}_task_${tid}`]) done++;
    });
  });
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('completedCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
}

function selectLesson(id) {
  currentLesson = id;
  currentTask = 0;
  renderSidebar();
  renderLesson(id);
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('contentArea').scrollTop = 0;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function renderLesson(id) {
  const lesson = lessons[id];
  const area = document.getElementById('contentArea');
  
  let html = `<div class="fade-in">`;
  html += `<div class="lesson-header">
    <div class="lesson-badge">${lesson.meta}</div>
    <h1 class="lesson-h1">${lesson.title}</h1>
  </div>`;
  html += `<div class="theory">${lesson.theory}</div>`;
  
  if (id === 0) {
    // Welcome screen
    html += `
      <div class="welcome">
        <div class="welcome-stats">
          <div class="welcome-stat">
            <div class="num">15</div>
            <div class="label">Уроков</div>
          </div>
          <div class="welcome-stat">
            <div class="num">25+</div>
            <div class="label">Заданий</div>
          </div>
          <div class="welcome-stat">
            <div class="num">∞</div>
            <div class="label">Возможностей</div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="startCourse()" style="font-size:18px;padding:14px 32px;">
          🚀 Начать обучение
        </button>
      </div>
    `;
  }
  
  if (lesson.tasks && lesson.tasks.length > 0) {
    html += `<h2 style="margin-top:40px;margin-bottom:20px;color:var(--accent-green);">📝 Задания</h2>`;
    lesson.tasks.forEach((task, tIdx) => {
      const key = `lesson_${id}_task_${tIdx}`;
      const isDone = completedTasks[key];
      const editorKey = `editor_${id}_${tIdx}`;
      const savedCode = editorStates[editorKey] || task.starter;
      
      html += `
        <div class="task-section" id="task_${tIdx}" style="${isDone ? 'border-color: var(--success);' : ''}">
          <div class="task-header">
            <div class="task-icon">${isDone ? '✅' : '💻'}</div>
            <div class="task-title">${task.title}</div>
          </div>
          <div class="task-description">${task.description}</div>
          <details class="hint-box">
            <summary>💡 Показать подсказку</summary>
            <div class="hint-content"><pre style="background:var(--bg-code);padding:10px;border-radius:4px;margin-top:8px;"><code>${task.hint.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre></div>
          </details>
          <div class="editor-wrap">
            <div class="editor-toolbar">
              <div class="editor-dots">
                <div class="editor-dot red"></div>
                <div class="editor-dot yellow"></div>
                <div class="editor-dot green"></div>
              </div>
              <div class="editor-filename">main.py</div>
            </div>
            <textarea class="code-editor" id="editor_${tIdx}" spellcheck="false">${savedCode.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
            <div class="editor-actions">
              <button class="btn btn-primary" onclick="runTask(${id}, ${tIdx})">▶ Запустить и проверить</button>
              <button class="btn btn-secondary" onclick="resetEditor(${id}, ${tIdx})">↺ Сбросить</button>
              <button class="btn btn-secondary" onclick="runOnly(${tIdx})">⚡ Только запустить</button>
            </div>
          </div>
          <div class="output-wrap" id="output_${tIdx}">
            <div class="output-header">Вывод программы</div>
            <div class="output-content" id="outputContent_${tIdx}"></div>
          </div>
          <div class="task-result" id="result_${tIdx}"></div>
        </div>
      `;
    });
  }
  
  // Navigation
  html += `<div class="lesson-nav">`;
  if (id > 0) {
    html += `<button class="btn btn-nav" onclick="selectLesson(${id - 1})">← Предыдущий</button>`;
  } else {
    html += `<div></div>`;
  }
  if (id < lessons.length - 1) {
    html += `<button class="btn btn-nav" onclick="selectLesson(${id + 1})">Следующий →</button>`;
  } else {
    html += `<div></div>`;
  }
  html += `</div></div>`;
  
  area.innerHTML = html;
  
  // Setup tab key in editors
  setTimeout(() => {
    document.querySelectorAll('.code-editor').forEach(editor => {
      editor.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
          editor.selectionStart = editor.selectionEnd = start + 4;
          saveEditorState(id, editor.id.replace('editor_', ''));
        }
      });
      editor.addEventListener('input', () => {
        const tIdx = editor.id.replace('editor_', '');
        saveEditorState(id, tIdx);
      });
    });
  }, 50);
}

function saveEditorState(lessonId, taskIdx) {
  const editor = document.getElementById(`editor_${taskIdx}`);
  if (editor) {
    editorStates[`editor_${lessonId}_${taskIdx}`] = editor.value;
    localStorage.setItem('pylearn_editors', JSON.stringify(editorStates));
  }
}

function startCourse() {
  completedTasks['lesson_0_welcome'] = true;
  localStorage.setItem('pylearn_completed', JSON.stringify(completedTasks));
  updateProgress();
  renderSidebar();
  selectLesson(1);
}

function resetEditor(lessonId, taskIdx) {
  const task = lessons[lessonId].tasks[taskIdx];
  const editor = document.getElementById(`editor_${taskIdx}`);
  editor.value = task.starter;
  saveEditorState(lessonId, taskIdx);
  document.getElementById(`output_${taskIdx}`).classList.remove('visible');
  document.getElementById(`result_${taskIdx}`).classList.remove('visible');
}

async function runOnly(taskIdx) {
  const editor = document.getElementById(`editor_${taskIdx}`);
  const code = editor.value;
  const outputWrap = document.getElementById(`output_${taskIdx}`);
  const outputContent = document.getElementById(`outputContent_${taskIdx}`);
  
  outputWrap.classList.add('visible');
  outputContent.className = 'output-content';
  outputContent.textContent = 'Выполняется...';
  
  try {
    pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);
    await pyodide.runPythonAsync(code);
    const output = pyodide.runPython('sys.stdout.getvalue()');
    pyodide.runPython('sys.stdout = sys.__stdout__');
    outputContent.textContent = output || '(нет вывода)';
  } catch (e) {
    pyodide.runPython('sys.stdout = sys.__stdout__');
    outputContent.className = 'output-content error';
    outputContent.textContent = 'Ошибка: ' + e.message;
  }
}

async function runTask(lessonId, taskIdx) {
  const editor = document.getElementById(`editor_${taskIdx}`);
  const code = editor.value;
  const task = lessons[lessonId].tasks[taskIdx];
  const outputWrap = document.getElementById(`output_${taskIdx}`);
  const outputContent = document.getElementById(`outputContent_${taskIdx}`);
  const resultDiv = document.getElementById(`result_${taskIdx}`);
  
  outputWrap.classList.add('visible');
  outputContent.className = 'output-content';
  outputContent.textContent = 'Выполняется...';
  resultDiv.classList.remove('visible');
  
  try {
    pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);
    await pyodide.runPythonAsync(code);
    const output = pyodide.runPython('sys.stdout.getvalue()');
    pyodide.runPython('sys.stdout = sys.__stdout__');
    
    outputContent.textContent = output || '(нет вывода)';
    
    // Validate
    const isValid = task.validate(output);
    if (isValid) {
      resultDiv.className = 'task-result visible success';
      resultDiv.innerHTML = '✅ Отлично! Задание выполнено верно!';
      completedTasks[`lesson_${lessonId}_task_${taskIdx}`] = true;
      localStorage.setItem('pylearn_completed', JSON.stringify(completedTasks));
      updateProgress();
      renderSidebar();
      // Update task icon
      const taskSection = document.getElementById(`task_${taskIdx}`);
      if (taskSection) {
        taskSection.style.borderColor = 'var(--success)';
        const icon = taskSection.querySelector('.task-icon');
        if (icon) icon.textContent = '✅';
      }
    } else {
      resultDiv.className = 'task-result visible error';
      resultDiv.innerHTML = '❌ Пока неверно. Проверьте вывод программы и попробуйте снова.';
    }
  } catch (e) {
    pyodide.runPython('sys.stdout = sys.__stdout__');
    outputContent.className = 'output-content error';
    outputContent.textContent = 'Ошибка: ' + e.message;
    resultDiv.className = 'task-result visible error';
    resultDiv.innerHTML = '❌ Ошибка в коде. Исправьте и попробуйте снова.';
  }
}

// Start
initPyodide();
</script>
